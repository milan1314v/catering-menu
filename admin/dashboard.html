<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Dashboard - DineVault Admin</title>
    <link rel="stylesheet" href="admin_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="admin-layout">
        <aside class="sidebar glass-sidebar">
            <div class="sidebar-header">
                <i class="fas fa-utensils"></i>
                <span>DineVault</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a href="manage_content.html"><i class="fas fa-edit"></i> Manage Content</a>
                <a href="manage_restaurants.html"><i class="fas fa-store"></i> Manage Restaurants</a>
            </nav>
            <div class="sidebar-footer">
                <a href="../index.html" target="_blank"><i class="fas fa-external-link-alt"></i> View Site</a>
                <a href="#" onclick="adminLogout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </aside>

        <main class="main-content">
            <div class="topbar glass-topbar">
                <h2>Dashboard</h2>
                <span>Welcome, Admin</span>
            </div>

            <div class="stats-row">
                <div class="stat-card-admin glass-card">
                    <div class="stat-icon" style="background:rgba(200,169,126,0.15);color:#c8a97e;"><i
                            class="fas fa-file-alt"></i></div>
                    <div>
                        <div class="stat-number-admin">11</div>
                        <div class="stat-label-admin">Content Pages</div>
                    </div>
                </div>
                <div class="stat-card-admin glass-card">
                    <div class="stat-icon" style="background:rgba(33,150,243,0.15);color:#2196f3;"><i
                            class="fas fa-store"></i></div>
                    <div>
                        <div class="stat-number-admin" id="statTotalRestaurants">...</div>
                        <div class="stat-label-admin">Total Restaurants</div>
                    </div>
                </div>
                <div class="stat-card-admin glass-card">
                    <div class="stat-icon" style="background:rgba(76,175,80,0.15);color:#4caf50;"><i
                            class="fas fa-check-circle"></i></div>
                    <div>
                        <div class="stat-number-admin" id="statApproved">...</div>
                        <div class="stat-label-admin">Approved</div>
                    </div>
                </div>
                <div class="stat-card-admin glass-card">
                    <div class="stat-icon" style="background:rgba(255,152,0,0.15);color:#ff9800;"><i
                            class="fas fa-clock"></i></div>
                    <div>
                        <div class="stat-number-admin" id="statPending">...</div>
                        <div class="stat-label-admin">Pending</div>
                    </div>
                </div>
            </div>

            <div class="card glass-card">
                <div class="card-header">
                    <h3><i class="fas fa-store"></i> Recent Restaurants</h3>
                    <a href="manage_restaurants.html" class="btn-sm">View All</a>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Cuisine</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="recentRestaurantsBody">
                            <tr>
                                <td colspan="5" style="text-align:center;color:var(--text-dim);">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card glass-card" style="margin-top:24px;">
                <div class="card-header">
                    <h3><i class="fas fa-envelope"></i> Recent Inquiries</h3>
                </div>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Subject</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="recentContactsBody">
                            <tr>
                                <td colspan="5" style="text-align:center;color:var(--text-dim);">No inquiries yet</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
    <script>
        if (!requireAuth()) { }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/admin/stats', {
                    headers: authHeaders()
                });
                if (res.status === 401) {
                    adminLogout();
                    return;
                }
                const data = await res.json();
                const s = data.stats || {};
                document.getElementById('statTotalRestaurants').textContent = s.total_restaurants ?? 0;
                document.getElementById('statApproved').textContent = s.approved_restaurants ?? 0;
                document.getElementById('statPending').textContent = s.pending_restaurants ?? 0;

                const tbody = document.getElementById('recentRestaurantsBody');
                if (Array.isArray(data.recent_restaurants) && data.recent_restaurants.length > 0) {
                    tbody.innerHTML = data.recent_restaurants.map(r => `
                    <tr>
                        <td>#${r.id}</td>
                        <td><strong>${escapeHtml(r.name || 'Untitled')}</strong></td>
                        <td>${escapeHtml(r.cuisine || '-')}</td>
                        <td><span class="badge badge-${r.status}">${r.status ? r.status.toUpperCase() : 'PENDING'}</span></td>
                        <td><a href="manage_restaurants.html?edit=${r.id}" class="btn-sm btn-info"><i class="fas fa-edit"></i> Edit</a></td>
                    </tr>
                `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-dim);">No restaurants found</td></tr>';
                }

                const cbody = document.getElementById('recentContactsBody');
                if (Array.isArray(data.recent_contacts) && data.recent_contacts.length > 0) {
                    cbody.innerHTML = data.recent_contacts.map(c => `
                    <tr>
                        <td>#${c.id}</td>
                        <td><strong>${escapeHtml(c.name || '')}</strong></td>
                        <td>${escapeHtml(c.email || '')}</td>
                        <td>${escapeHtml(c.subject || '')}</td>
                        <td>${escapeHtml((c.submitted_at || '').substring(0, 10))}</td>
                    </tr>
                `).join('');
                } else {
                    cbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-dim);">No inquiries yet</td></tr>';
                }
            } catch (e) {
                console.error('Error loading stats', e);
            }
        });
    </script>
</body>

</html>
