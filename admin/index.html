<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login - Catering Menu</title>
    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/x-icon" href="/assets/img/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
    <link rel="manifest" href="/assets/img/site.webmanifest">
    <link rel="stylesheet" href="admin_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-body">

<div class="login-container">
    <div class="login-card glass-card">
        <div class="login-header">
            <img src="/assets/img/catering-menu-logo.png" alt="Catering Menu" style="max-height: 56px; margin: 0 auto 12px; display: block;">
            <h1 style="font-size: 1.4rem; margin-bottom: 4px;">Catering Menu</h1>
            <p>Admin Control Panel</p>
        </div>

        <div id="loginAlert" class="alert alert-error" style="display:none;">
            <i class="fas fa-exclamation-circle"></i>
            <span id="loginAlertText">Invalid username or password.</span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" required placeholder="Enter username" autocomplete="username">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" required placeholder="Enter password" autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="submitLoginBtn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>
    </div>
</div>

<script src="admin.js"></script>
<script>
    if (getAuthToken()) {
        window.location.href = '/admin/dashboard.html';
    }

    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('loginAlert');
    const alertText = document.getElementById('loginAlertText');
    const btn = document.getElementById('submitLoginBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (res.ok && data.success) {
                setAuthToken(data.token);
                window.location.href = '/admin/dashboard.html';
            } else {
                alertText.textContent = data.error || 'Invalid credentials';
                alertBox.style.display = 'flex';
            }
        } catch (err) {
            alertText.textContent = 'Server connection error.';
            alertBox.style.display = 'flex';
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
        }
    });
</script>
</body>
</html>
